name: PodToast Linux agent
on:
  pull_request:
    paths: ['cmd/podtoast/**', 'internal/podtoast/**', 'internal/kube/**', 'podtoast/**', 'go.mod', 'go.sum', '.github/workflows/podtoast.yml']
  push:
    branches: [main]
    paths: ['cmd/podtoast/**', 'internal/podtoast/**', 'internal/kube/**', 'podtoast/**', 'go.mod', 'go.sum', '.github/workflows/podtoast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Linux race tests and both architectures
        run: |
          go test -race ./internal/podtoast ./internal/kube
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/podtoast-amd64 ./cmd/podtoast
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/podtoast-arm64 ./cmd/podtoast
      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.26.0
      - name: Ephemeral container integration test
        run: ./podtoast/test.sh
