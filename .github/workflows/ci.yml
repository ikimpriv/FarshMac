name: macOS checks and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Test, vet, format, and renderer checks
        run: ./scripts/check.sh --race
      - name: Build and package universal app (ad-hoc signed)
        run: ./scripts/package.sh
      - name: Upload build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FarshMac-macOS-universal
          path: |
            build/FarshMac-*-macOS-universal.zip
            build/FarshMac-*-macOS-universal.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
