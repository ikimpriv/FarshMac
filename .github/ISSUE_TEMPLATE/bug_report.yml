name: Bug report
description: Report a reproducible problem in FarshMac.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: FarshMac version / commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, architecture, and shell
      placeholder: macOS version, Apple Silicon / Intel, bash / sh / zsh
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior. Use a small, non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or screenshots
      description: Remove passwords, keys, tokens, private server names, and personal paths before posting.
